services:
  postgres:
    image: postgres:18
    container_name: research-workspace-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - research_workspace_pg18_data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: research-workspace-redis

    ports:
      - "6379:6379"

volumes:
  research_workspace_pg18_data: